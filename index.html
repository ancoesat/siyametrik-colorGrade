<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renk</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #1c1c1e; color: #e5e5e7; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; accent-color: #0a84ff; user-select: none; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #2c2c2e; border-bottom: 1px solid #000; }
  header b { font-size: 14px; margin-right: 8px; }
  #status { color: #98989d; margin-left: 8px; }
  .sp { flex: 1; }
  button { font: inherit; color: #e5e5e7; background: #3a3a3c; border: 0; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { background: #48484a; }
  button.on, button.primary { background: #0a84ff; color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; overflow: hidden; background: #111; }
  #gl { width: 100%; height: 100%; display: block; }
  #split { position: absolute; top: 0; bottom: 0; width: 24px; margin-left: -12px; cursor: ew-resize; display: none; touch-action: none; }
  #split i { position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 4px #000; }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; color: #98989d; font-size: 15px; }
  aside { width: 280px; background: #2c2c2e; border-left: 1px solid #000; padding: 12px; overflow-y: auto; }
  h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #98989d; margin: 16px 0 8px; }
  h3:first-child { margin-top: 0; }
  #looks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #sliders { margin-top: 12px; }
  .row { margin-bottom: 8px; }
  .row div { display: flex; justify-content: space-between; }
  .row span { color: #98989d; font-variant-numeric: tabular-nums; }
  .row input { width: 100%; margin: 2px 0 0; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  #info { color: #98989d; margin-top: 14px; font-size: 12px; }
  footer { display: flex; gap: 6px; padding: 6px 12px; background: #2c2c2e; border-top: 1px solid #000; overflow-x: auto; min-height: 76px; }
  footer img { height: 62px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; background: #111; min-width: 40px; }
  footer img.on { border-color: #0a84ff; }
  body.drag #stage { outline: 2px dashed #0a84ff; outline-offset: -8px; }
</style>
</head>
<body>
<header>
  <b>Renk</b>
  <button id="open" class="primary">Fotoğraf aç</button>
  <span id="status"></span>
  <span class="sp"></span>
  <button id="cmp" title="Önce / sonra çizgisi">Karşılaştır</button>
  <button id="exp" disabled>Dışa aktar</button>
  <button id="expAll" disabled>Tümünü dışa aktar</button>
</header>
<main>
  <section id="stage">
    <canvas id="gl"></canvas>
    <div id="split"><i></i></div>
    <div id="empty">DNG veya JPG fotoğraflarını buraya sürükle<button id="open2">Fotoğraf aç</button></div>
  </section>
  <aside>
    <h3>Görünüm</h3>
    <div id="looks"></div>
    <div id="sliders"></div>
    <div class="btns">
      <button id="auto" title="Pozlamayı ve ışığı otomatik dengeler">Otomatik</button>
      <button id="reset">Sıfırla</button>
      <button id="all" title="Bu ayarları açık olan bütün fotoğraflara kopyalar">Tümüne uygula</button>
    </div>
    <div id="info">Boşluk tuşu basılıyken orijinali gösterir. Ok tuşları fotoğraf değiştirir. Çift tık yakınlaştırır. Bir ayarı sıfırlamak için adına çift tıkla.</div>
  </aside>
</main>
<footer id="strip"></footer>
<input id="file" type="file" multiple hidden accept=".dng,image/jpeg,image/png,image/webp">
<script src="dng.js"></script>
<script src="app.js"></script>
</body>
</html>
